<div
  class="bg-surface dark:bg-dark-surface-elevated border border-border dark:border-dark-border rounded-xl shadow-sm dark:shadow-dark-sm mt-4 sm:mt-6">
  <div class="px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-2 sm:gap-3">
      <span class="text-text-primary dark:text-dark-text-primary font-medium text-xs sm:text-sm lg:text-base whitespace-nowrap">
        {{ 'common.pagination.rowsPerPage' | translate }}
      </span>
      <select [(ngModel)]="limit" (change)="onLimitChanged($event)"
        class="pagination-select bg-surface-tertiary dark:bg-dark-surface-tertiary text-text-primary dark:text-dark-text-primary border border-border dark:border-dark-border rounded-lg px-2 sm:px-3 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark focus:border-transparent min-h-[44px]">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="25">25</option>
        <option value="100">100</option>
      </select>
    </div>

    <div class="flex items-center gap-2 sm:gap-3 justify-between sm:justify-end">
      <span class="text-text-secondary dark:text-dark-text-secondary text-xs sm:text-sm hidden sm:inline">
        {{ rangeText }}
      </span>
      <span class="text-text-secondary dark:text-dark-text-secondary text-xs sm:hidden">
        {{ currentPage }} / {{ totalPages }}
      </span>
      <div class="flex items-center gap-2">
        <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1"
          class="pagination-button min-h-[44px] min-w-[44px] sm:min-w-auto px-3 sm:px-4">
          <span class="hidden sm:inline">{{ 'common.pagination.previous' | translate }}</span>
          <span class="sm:hidden">‹</span>
        </button>
        <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage >= totalPages"
          class="pagination-button min-h-[44px] min-w-[44px] sm:min-w-auto px-3 sm:px-4">
          <span class="hidden sm:inline">{{ 'common.pagination.next' | translate }}</span>
          <span class="sm:hidden">›</span>
        </button>
      </div>
    </div>
  </div>
</div>
