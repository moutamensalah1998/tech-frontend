    <div class="reply-input-container" *ngIf="replyingToMessage">
      <div class="reply-preview">
        <div class="reply-indicator">
          <div class="reply-line"></div>
          <div class="reply-content">
            <div class="reply-header">
              <svg class="reply-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M3 10h10a8 8 0 0 1 8 8v2M3 10l6 6m-6-6l6-6"/>
              </svg>
              <span class="reply-to-label">
                Replying to {{ replyingToMessage.is_from_contact ? 'Contact' : 'You' }}
              </span>
              <button class="cancel-reply-btn" (click)="cancelReply()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <div class="reply-message-preview">
              {{ getReplyPreviewText() }}
            </div>
          </div>
        </div>
      </div>
    </div>
