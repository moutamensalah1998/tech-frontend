    <div
      class="inline-flex items-center button-message"
      [ngClass]="getMessageClasses()"
    >
      <!-- Button Reply Indicator -->
      <div class="flex items-center space-x-2">
        <!-- Button Icon -->
        <div class="flex-shrink-0">
          <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
            <svg
              class="w-4 h-4 text-blue-600"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              [ngSwitch]="buttonView.buttonType"
            >
              <!-- Quick Reply Icon -->
              <path *ngSwitchCase="'quick_reply'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />

              <!-- URL Icon -->
              <path *ngSwitchCase="'url'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />

              <!-- Phone Icon -->
              <path *ngSwitchCase="'phone_number'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />

              <!-- Generic Button Icon -->
              <path *ngSwitchDefault stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
            </svg>
          </div>
        </div>

        <!-- Button Content -->
        <div class="flex-1">
          <div class="bg-blue-100 border border-blue-200 rounded-full px-4 py-2">
            <div class="flex items-center space-x-2">
              <span class="text-sm font-medium text-blue-800">
                {{ buttonView.text }}
              </span>

              <!-- Button Type Badge -->
              <span
                *ngIf="buttonView.buttonType !== 'generic'"
                class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-blue-200 text-blue-700"
              >
                {{ getButtonTypeLabel() }}
              </span>
            </div>
          </div>

          <!-- Context Information -->
          <div
            *ngIf="buttonView.contextId"
            class="mt-1 text-xs text-gray-500 pl-4"
          >
            <span class="flex items-center space-x-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
              </svg>
              <span>Reply to message</span>
            </span>
          </div>
        </div>
      </div>
    </div>
