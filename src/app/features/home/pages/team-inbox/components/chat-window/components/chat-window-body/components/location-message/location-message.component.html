<div
  class="rounded-lg p-3 max-w-xs shadow-md"
  [ngClass]="getMessageClasses()"
>
  <div class="flex flex-col items-center space-y-3">
    <!-- Location Preview/Map Area -->
    <div class="w-full h-32 bg-gray-100 rounded-lg border border-gray-200 relative overflow-hidden">
      <!-- Static map representation -->
      <div class="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100">
        <div class="text-center">
          <div class="text-4xl mb-2">📍</div>
          <div class="text-xs text-gray-600 font-medium">Location</div>
        </div>
      </div>

      <!-- Coordinate overlay -->
      <div class="absolute bottom-2 left-2 right-2">
        <div class="bg-black bg-opacity-60 text-white text-xs px-2 py-1 rounded text-center">
          {{ getCoordinatesDisplay() }}
        </div>
      </div>
    </div>

    <!-- Location Name -->
    <div *ngIf="message.content?.name" class="text-center">
      <div class="font-medium text-sm text-gray-900">{{ message.content.name }}</div>
    </div>

    <!-- Location Address -->
    <div *ngIf="message.content?.address" class="text-center">
      <div class="text-xs text-gray-600 leading-relaxed">{{ message.content.address }}</div>
    </div>

    <!-- Coordinates Display -->
    <div class="text-center">
      <span class="text-xs text-gray-500">
        {{ message.content?.latitude }}, {{ message.content?.longitude }}
      </span>
    </div>

    <!-- View on Maps Button - UPDATED -->
    <div class="w-full pt-2 border-t border-gray-200">
      <button
        (click)="openGoogleMaps($event)"
        class="w-full flex items-center justify-center space-x-2 text-blue-600 hover:text-blue-700 text-sm font-medium transition-colors py-2 px-3 rounded-md hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>View on Google Maps</span>
      </button>
    </div>
  </div>
</div>
