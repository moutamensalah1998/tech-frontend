<div
  class="rounded-lg p-3 max-w-lg shadow-md border"
  [ngClass]="getMessageClasses()"
>
  <div class="flex flex-col space-y-2">
    <!-- Media Header (if present) - NOW INTERACTIVE -->
    <div *ngIf="templateView.hasMedia" class="mb-2">
      <div [ngSwitch]="templateView.mediaType">
        <!-- Image Media - CLICKABLE -->
        <div *ngSwitchCase="'image'" class="rounded-lg overflow-hidden">
          <img
            [src]="templateView.mediaUrl"
            alt="Template header image"
            class="w-full max-h-40 object-cover cursor-pointer hover:opacity-80 transition-opacity"
            (click)="onImageClick()"
            (error)="onImageError($event)"
          />
        </div>

        <!-- Video Media - CLICKABLE -->
        <div *ngSwitchCase="'video'" class="rounded-lg overflow-hidden relative">
          <div
            class="cursor-pointer hover:opacity-80 transition-opacity"
            (click)="onVideoClick()"
          >
            <video
              class="w-full max-h-40 object-cover"
              preload="metadata"
              [poster]="getVideoPoster()"
            >
              <source [src]="templateView.mediaUrl" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
            <!-- Play overlay -->
            <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30">
              <div class="w-12 h-12 bg-white bg-opacity-90 rounded-full flex items-center justify-center">
                <svg class="w-6 h-6 text-gray-700 ml-1" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M8 5v10l8-5-8-5z" />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Document Media -->
        <div *ngSwitchCase="'document'" class="bg-gray-50 border border-gray-200 rounded-lg p-3 flex items-center space-x-3">
          <div class="flex-shrink-0">
            <svg class="w-8 h-8 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
              <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate">Document</p>
            <p class="text-xs text-gray-500">Attached file</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Text Header -->
    <div
      *ngIf="templateView.headerText && !templateView.hasMedia"
      class="font-semibold text-gray-800 text-sm border-b border-gray-200 pb-2"
    >
      {{ templateView.headerText }}
    </div>

    <!-- Body Content -->
    <div class="space-y-1">
      <div
        *ngFor="let line of templateView.bodyTexts; let i = index"
        class="text-gray-700 text-sm leading-relaxed"
        [class.font-medium]="i === 0 && templateView.bodyTexts.length > 1"
      >
        {{ line }}
      </div>
    </div>

    <!-- Footer -->
    <div *ngIf="templateView.footerText" class="text-xs text-gray-500 mt-2 pt-2 border-t border-gray-100">
      {{ templateView.footerText }}
    </div>

    <!-- Display Buttons (non-interactive) -->
    <div
      *ngIf="templateView.buttons.length"
      class="flex flex-col space-y-2 mt-3 pt-2 border-t border-gray-200"
    >
      <div
        *ngFor="let btn of templateView.buttons"
        class="w-full px-3 py-2 text-sm font-medium rounded-md border bg-gray-50 border-gray-200 text-gray-600"
      >
        <div class="flex items-center justify-center space-x-2">
          <ng-container [ngSwitch]="btn.type">
            <!-- Quick Reply Button -->
            <ng-container *ngSwitchCase="'quick_reply'">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
              </svg>
              <span>{{ btn.text }}</span>
            </ng-container>

            <!-- URL Button -->
            <ng-container *ngSwitchCase="'url'">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
              </svg>
              <span>{{ btn.text }}</span>
            </ng-container>

            <!-- Phone Button -->
            <ng-container *ngSwitchCase="'phone_number'">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
              </svg>
              <span>{{ btn.text }}</span>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
