    <div class="flex items-center justify-center h-full w-full drag-overlay">
      <div
        class="bg-white rounded-xl shadow-lg p-8 border-2 border-dashed max-w-md mx-4 text-center"
        [ngClass]="isValidDrop ? 'border-blue-400 bg-blue-50' : 'border-red-400 bg-red-50'"
      >
        <div class="mb-4">
          <svg
            class="w-16 h-16 mx-auto"
            [ngClass]="isValidDrop ? 'text-blue-500' : 'text-red-500'"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              *ngIf="isValidDrop"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
            />
            <path
              *ngIf="!isValidDrop"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>

        <div [ngClass]="isValidDrop ? 'text-blue-700' : 'text-red-700'">
          <h3 class="text-lg font-semibold mb-2">
            {{ (isValidDrop ? 'chat.dropFilesToSend' : 'chat.invalidFileType') | translate }}
          </h3>

          <p class="text-sm" *ngIf="isValidDrop">
            {{ 'chat.releaseToUpload' | translate }}
          </p>

          <p class="text-sm" *ngIf="!isValidDrop">
            {{ 'chat.onlySupportedFormats' | translate }}
          </p>

          <div class="mt-4 text-xs opacity-75" *ngIf="isValidDrop">
            <div>{{ 'chat.supportedFormats' | translate }}</div>
            <div>{{ 'chat.imagesVideosAudioDocuments' | translate }}</div>
            <div>{{ 'chat.maxSize' | translate }}</div>
          </div>
        </div>
      </div>
    </div>
