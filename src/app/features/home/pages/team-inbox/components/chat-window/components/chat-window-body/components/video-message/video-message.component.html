  <div
      class="rounded-lg p-3 max-w-xs shadow-md"
      [ngClass]="
        message.is_from_contact
          ? 'bg-white text-gray-900'
          : 'bg-green-100 text-gray-900'
      "
    >
      <div class="text-[10px] text-gray-400 mb-1">
        {{ message.message_type }}
      </div>
      <div
        class="relative cursor-pointer hover:opacity-80 transition-opacity"
        (click)="onVideoClick()"
      >
        <video
          class="rounded mb-1 max-w-full max-h-48"
          preload="metadata"
        >
          <source
            [src]="message.content?.cdn_url"
            [type]="message.content?.mime_type"
          />
          Your browser does not support the video tag.
        </video>
        <!-- Play overlay -->
        <div
          class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 rounded"
        >
          <div
            class="w-12 h-12 bg-white bg-opacity-80 rounded-full flex items-center justify-center"
          >
            <svg
              class="w-6 h-6 text-gray-700 ml-1"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path d="M8 5v10l8-5-8-5z" />
            </svg>
          </div>
        </div>
      </div>
      <div
        *ngIf="message.content?.caption"
        class="text-xs text-gray-600 mt-1"
      >
        {{ message.content.caption }}
      </div>
    </div>
