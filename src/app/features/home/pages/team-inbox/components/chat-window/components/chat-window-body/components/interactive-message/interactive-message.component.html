<!-- interactive-message.component.html -->
<div
  class="rounded-lg shadow-md border w-[320px]"
  [ngClass]="getMessageClasses()"
>
  <div class="p-4 space-y-3">
    <!-- Header Section -->
    <div *ngIf="interactiveView?.header" class="space-y-2">
      <ng-container [ngSwitch]="interactiveView?.header?.type">
        <!-- Text Header -->
        <div
          *ngSwitchCase="'text'"
          class="font-semibold text-gray-800 text-sm"
        >
          {{ interactiveView?.header?.text }}
        </div>

        <!-- Image Header - NOW CLICKABLE -->
        <div *ngSwitchCase="'image'" class="rounded-lg overflow-hidden">
          <img
            *ngIf="interactiveView?.header?.imageUrl"
            [src]="interactiveView?.header?.imageUrl"
            alt="Interactive header"
            class="w-full max-h-32 object-cover cursor-pointer hover:opacity-80 transition-opacity"
            (click)="onImageClick()"
            (error)="onImageError($event)"
          />
          <div
            *ngIf="!interactiveView?.header?.imageUrl"
            class="w-full h-24 bg-gray-200 flex items-center justify-center rounded"
          >
            <div class="text-center">
              <svg class="w-8 h-8 text-gray-400 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span class="text-gray-500 text-xs">Image not available</span>
            </div>
          </div>
        </div>

        <!-- Video Header - NOW CLICKABLE -->
        <div *ngSwitchCase="'video'" class="rounded-lg overflow-hidden">
          <div
            *ngIf="interactiveView?.header?.videoUrl"
            class="relative cursor-pointer hover:opacity-80 transition-opacity"
            (click)="onVideoClick()"
          >
            <video class="w-full max-h-32 object-cover" preload="metadata" [poster]="message.content?.header?.thumbnail_url">
              <source [src]="interactiveView?.header?.videoUrl" />
            </video>
            <!-- Play overlay -->
            <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30">
              <div class="w-12 h-12 bg-white bg-opacity-90 rounded-full flex items-center justify-center">
                <svg class="w-6 h-6 text-gray-700 ml-1" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M8 5v10l8-5-8-5z" />
                </svg>
              </div>
            </div>
          </div>
          <div
            *ngIf="!interactiveView?.header?.videoUrl"
            class="w-full h-24 bg-gray-200 flex items-center justify-center rounded"
          >
            <div class="text-center">
              <svg class="w-8 h-8 text-gray-400 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
              <span class="text-gray-500 text-xs">Video not available</span>
            </div>
          </div>
        </div>

        <!-- Document Header -->
        <div *ngSwitchCase="'document'" class="bg-gray-50 border border-gray-200 rounded p-3">
          <div class="flex items-center space-x-3">
            <div class="flex-shrink-0">
              <svg class="w-8 h-8 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                <path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-gray-900 truncate">
                {{ interactiveView?.header?.documentName || 'Document' }}
              </p>
              <p class="text-xs text-gray-500">Attached file</p>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Body Section -->
    <div *ngIf="interactiveView?.body?.length" class="text-gray-700 space-y-1">
      <div
        *ngFor="let line of interactiveView!.body; let i = index"
        class="text-sm leading-relaxed"
        [class.font-medium]="i === 0"
      >
        {{ line }}
      </div>
    </div>

    <!-- Footer Section -->
    <div *ngIf="interactiveView?.footer" class="text-xs text-gray-500 border-t border-gray-100 pt-2">
      {{ interactiveView?.footer }}
    </div>

    <!-- List Items Display (for list type interactive messages) -->
    <div
      *ngIf="interactiveView?.type === 'list' && interactiveView?.listItems?.length"
      class="space-y-2 border-t border-gray-200 pt-3"
    >
      <div class="text-xs font-medium text-gray-600 uppercase tracking-wide">
        Options:
      </div>
      <div
        *ngFor="let item of interactiveView?.listItems"
        class="p-3 border border-gray-200 rounded-lg bg-gray-50"
      >
        <div class="flex items-start justify-between">
          <div class="flex-1">
            <div class="text-sm font-medium text-gray-900">{{ item.title }}</div>
            <div *ngIf="item.description" class="text-xs text-gray-600 mt-1">
              {{ item.description }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Button Options Display (for button type interactive messages) -->
    <div
      *ngIf="interactiveView?.type === 'button' && interactiveView?.buttons?.length"
      class="space-y-2 border-t border-gray-200 pt-3"
    >
      <div class="text-xs font-medium text-gray-600 uppercase tracking-wide">
        Options:
      </div>
      <div
        *ngFor="let btn of interactiveView?.buttons"
        class="w-full px-4 py-3 text-sm font-medium rounded-lg border bg-gray-50 border-gray-200 text-gray-600"
      >
        <div class="flex items-center justify-center">
          <span>{{ btn.title }}</span>
        </div>
      </div>
    </div>

    <!-- Flow/Carousel Type Display -->
    <div
      *ngIf="interactiveView?.type === 'flow'"
      class="border-t border-gray-200 pt-3"
    >
      <div class="text-center text-sm text-gray-600 bg-gray-50 p-3 rounded">
        Flow interaction content
      </div>
    </div>
  </div>
</div>
