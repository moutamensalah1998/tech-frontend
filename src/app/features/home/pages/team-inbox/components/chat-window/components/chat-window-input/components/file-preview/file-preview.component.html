<div class="bg-surface dark:bg-dark-surface border-t border-border dark:border-dark-border p-4 space-y-4">
  <div class="flex items-center justify-between">
    <h4 class="text-sm font-medium text-text-primary dark:text-dark-text-primary">
      Files to send ({{ filePreviews.length }})
    </h4>
    <button (click)="clearAll()"
      class="text-xs text-danger dark:text-danger-dark hover:text-danger-hover dark:hover:text-danger transtion-colors">
      Clear all
    </button>
  </div>

  <!-- File Preview List -->
  <div class="space-y-3 max-h-64 overflow-y-auto">
    <div *ngFor="let preview of filePreviews"
      class="flex items-start space-x-3 p-3 bg-surface-secondary dark:bg-dark-surface-secondary rounded-lg border border-border dark:border-dark-border">
      <!-- File Preview -->
      <div class="flex-shrink-0">
        <ng-container [ngSwitch]="preview.type">
          <!-- Image Preview -->
          <img *ngSwitchCase="'image'" [src]="preview.url" alt="Preview" class="w-16 h-16 object-cover rounded-md" />

          <!-- Video Preview -->
          <div *ngSwitchCase="'video'" class="relative">
            <video [src]="preview.url" class="w-16 h-16 object-cover rounded-md" preload="metadata"></video>
            <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-30 rounded-md">
              <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                <path d="M8 5v10l8-5-8-5z" />
              </svg>
            </div>
          </div>

          <!-- Audio Preview -->
          <div *ngSwitchCase="'audio'"
            class="w-16 h-16 bg-blue-100 dark:bg-blue-900/30 rounded-md flex items-center justify-center">
            <svg class="w-8 h-8 text-blue-600 dark:text-blue-400" fill="currentColor" viewBox="0 0 20 20">
              <path
                d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z" />
            </svg>
          </div>

          <!-- Document Preview -->
          <div *ngSwitchDefault
            class="w-16 h-16 bg-surface-tertiary dark:bg-dark-surface-tertiary rounded-md flex items-center justify-center">
            <svg class="w-8 h-8 text-text-secondary dark:text-dark-text-secondary" fill="currentColor"
              viewBox="0 0 20 20">
              <path
                d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" />
            </svg>
          </div>
        </ng-container>
      </div>

      <!-- File Info and Caption -->
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between">
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-text-primary dark:text-dark-text-primary truncate">
              {{ preview.file.name }}
            </p>
            <p class="text-xs text-text-tertiary dark:text-dark-text-tertiary">
              {{ filePreviewService.getFileSize(preview.file) }} • {{ preview.type.toUpperCase() }}
            </p>
          </div>
          <button (click)="removeFile(preview.id)"
            class="ml-2 text-text-tertiary dark:text-dark-text-tertiary hover:text-danger dark:hover:text-danger-dark transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Caption Input -->
        <div class="mt-2">
          <input type="text" [value]="preview.caption" (input)="updateCaption(preview.id, $any($event.target).value)"
            placeholder="Add a caption..."
            class="w-full px-3 py-1.5 text-sm border border-border dark:border-dark-border rounded-md bg-white dark:bg-dark-surface text-text-primary dark:text-dark-text-primary focus:outline-none focus:ring-1 focus:ring-primary dark:focus:ring-primary-dark focus:border-primary dark:focus:border-primary-dark placeholder-text-tertiary dark:placeholder-dark-text-tertiary" />
        </div>
      </div>
    </div>
  </div>

  <!-- Send All Button -->
  <div class="flex justify-end space-x-2 pt-3 border-t border-border dark:border-dark-border">
    <button (click)="clearAll()"
      class="px-4 py-2 text-sm font-medium text-text-primary dark:text-dark-text-primary bg-surface dark:bg-dark-surface border border-border dark:border-dark-border rounded-md hover:bg-surface-secondary dark:hover:bg-dark-surface-secondary focus:outline-none focus:ring-2 focus:ring-primary">
      Cancel
    </button>
    <button (click)="sendAll()"
      class="px-4 py-2 text-sm font-medium text-white bg-primary dark:bg-primary-dark rounded-md hover:bg-primary-hover dark:hover:bg-primary focus:outline-none focus:ring-2 focus:ring-primary">
      Send {{ filePreviews.length }} file{{ filePreviews.length > 1 ? 's' : '' }}
    </button>
  </div>
</div>
