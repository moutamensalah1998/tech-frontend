<div class="flex flex-col items-center shadow-sm rounded-md">
  <!-- Top row with text + dividers -->
  <div class="flex items-center w-full">
    <hr class="flex-grow border-t border-white" />
    <span
      class="px-2 text-balck italic text-[0.7rem] items-center justify-center"
    >
      {{ message.content?.message || ('Chatbot ' + (message.content?.flow_status || '')) }}
    </span>
    <hr class="flex-grow border-t border-gray-300" />
  </div>

  <!-- Bottom divider -->
  <hr class="w-full border-t border-gray-300" />
</div>
