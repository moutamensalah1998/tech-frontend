<div class="notification-bell-container relative">
  <!-- Bell Button -->
  <button 
    #bellButton
    (click)="toggleDropdown()"
    class="relative p-2 rounded-lg hover:bg-surface-tertiary dark:hover:bg-dark-surface-tertiary transition-colors group"
    [attr.aria-label]="'notifications.title' | translate">
    
    <!-- Bell Icon -->
    <svg class="w-5 h-5 text-text-secondary dark:text-dark-text-secondary group-hover:text-primary dark:group-hover:text-primary-dark transition-colors" 
         fill="none" 
         stroke="currentColor" 
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
    
    <!-- Unread Badge -->
    <span *ngIf="unreadCount > 0" 
          class="absolute -top-1 -right-1 flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-red-500 dark:bg-red-600 rounded-full animate-pulse">
      {{ unreadCount > 9 ? '9+' : unreadCount }}
    </span>
  </button>

  <!-- Dropdown Panel -->
  <div *ngIf="isDropdownOpen" 
       class="notification-dropdown bg-surface dark:bg-dark-surface border border-border dark:border-dark-border rounded-xl shadow-xl dark:shadow-dark-xl overflow-hidden animate-in fade-in slide-in-from-top-2"
       [ngStyle]="dropdownStyle">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-border dark:border-dark-border bg-surface-secondary dark:bg-dark-surface-secondary">
      <h3 class="text-sm font-semibold text-text-primary dark:text-dark-text-primary">
        {{ 'notifications.title' | translate }}
      </h3>
      <div class="flex items-center gap-2">
        <button *ngIf="unreadCount > 0"
                (click)="markAllAsRead()"
                class="text-xs text-primary dark:text-primary-dark hover:text-primary-hover dark:hover:text-primary-active transition-colors">
          {{ 'notifications.markAllRead' | translate }}
        </button>
        <button *ngIf="notifications.length > 0"
                (click)="clearAll()"
                class="text-xs text-text-tertiary dark:text-dark-text-tertiary hover:text-red-500 dark:hover:text-red-400 transition-colors">
          {{ 'notifications.clearAll' | translate }}
        </button>
      </div>
    </div>

    <!-- Notifications List -->
    <div class="max-h-96 overflow-y-auto">
      <!-- Empty State -->
      <div *ngIf="notifications.length === 0" 
           class="flex flex-col items-center justify-center py-8 px-4">
        <svg class="w-12 h-12 text-text-tertiary dark:text-dark-text-tertiary mb-3" 
             fill="none" 
             stroke="currentColor" 
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <p class="text-sm text-text-tertiary dark:text-dark-text-tertiary">
          {{ 'notifications.noNotifications' | translate }}
        </p>
      </div>

      <!-- Notification Items -->
      <div *ngFor="let notification of notifications"
           (click)="markAsRead(notification)"
           class="flex items-start gap-3 px-4 py-3 border-b border-border/50 dark:border-dark-border/50 cursor-pointer transition-colors hover:bg-surface-secondary dark:hover:bg-dark-surface-secondary"
           [ngClass]="{'bg-primary/5 dark:bg-primary-dark/5': !notification.read}">
        
        <!-- Icon -->
        <div class="flex-shrink-0 w-9 h-9 rounded-full flex items-center justify-center"
             [ngClass]="{
               'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400': notification.type === 'conversation_assignment',
               'bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400': notification.type === 'new_message',
               'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400': notification.type === 'system'
             }">
          <!-- Assignment Icon -->
          <svg *ngIf="notification.type === 'conversation_assignment'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <!-- Message Icon -->
          <svg *ngIf="notification.type === 'new_message'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          <!-- System Icon -->
          <svg *ngIf="notification.type === 'system'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>

        <!-- Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <p class="text-sm font-medium text-text-primary dark:text-dark-text-primary line-clamp-1"
               [ngClass]="{'font-semibold': !notification.read}">
              {{ notification.title }}
            </p>
            <button (click)="removeNotification(notification, $event)"
                    class="flex-shrink-0 p-1 rounded hover:bg-surface-tertiary dark:hover:bg-dark-surface-tertiary transition-colors">
              <svg class="w-3.5 h-3.5 text-text-tertiary dark:text-dark-text-tertiary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <!-- Contact Info: Name and Phone -->
          <div *ngIf="notification.contactName || notification.contactPhone" class="flex items-center gap-2 mt-0.5">
            <span *ngIf="notification.contactName" class="text-xs font-medium text-primary dark:text-primary-dark">
              {{ notification.contactName }}
            </span>
            <span *ngIf="notification.contactName && notification.contactPhone" class="text-xs text-text-tertiary dark:text-dark-text-tertiary">·</span>
            <span *ngIf="notification.contactPhone" class="text-xs text-text-tertiary dark:text-dark-text-tertiary">
              {{ notification.contactPhone }}
            </span>
          </div>
          <!-- Message Preview -->
          <p *ngIf="notification.message" class="text-xs text-text-secondary dark:text-dark-text-secondary mt-0.5 line-clamp-2 italic">
            "{{ notification.message }}"
          </p>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-xs text-text-tertiary dark:text-dark-text-tertiary">
              {{ getRelativeTime(notification.timestamp) }}
            </span>
            <span *ngIf="!notification.read" 
                  class="w-1.5 h-1.5 bg-primary dark:bg-primary-dark rounded-full"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div *ngIf="notifications.length > 0" 
         class="px-4 py-2.5 border-t border-border dark:border-dark-border bg-surface-secondary dark:bg-dark-surface-secondary">
      <button (click)="markAllAsRead()"
              class="w-full text-center text-xs text-primary dark:text-primary-dark hover:text-primary-hover dark:hover:text-primary-active transition-colors py-1">
        {{ 'notifications.viewAll' | translate }}
      </button>
    </div>
  </div>
</div>
