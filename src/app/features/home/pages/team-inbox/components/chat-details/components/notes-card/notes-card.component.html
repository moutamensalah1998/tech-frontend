<div
  class="border border-border dark:border-dark-border rounded-lg bg-surface dark:bg-dark-surface shadow-md dark:shadow-dark-md">
  <div class="flex items-center justify-between p-4 bg-surface dark:bg-dark-surface rounded-t-lg">
    <div class="flex items-center gap-2">
      <span class="text-sm font-semibold text-text-primary dark:text-dark-text-primary select-none">{{
        'chatDetails.notesCard.title' | translate }}</span>
    </div>
    <button (click)="toggleNoteInput()"
      class="p-1 hover:bg-surface-secondary dark:hover:bg-dark-surface-secondary rounded-full transition-colors"
      [class.text-primary]="showNoteInput" [class.text-text-secondary]="!showNoteInput"
      [class.dark:text-dark-text-secondary]="!showNoteInput">
      <!-- plus icon -->
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
      </svg>
    </button>
  </div>

  <div class="px-4 pb-4 select-none pt-4">
    <div *ngIf="showNoteInput" class="mb-4">
      <textarea [(ngModel)]="noteContent" [placeholder]="'chatDetails.notesCard.writeNotePlaceholder' | translate"
        class="w-full px-3 py-2 border border-border dark:border-dark-border rounded-lg resize-none bg-surface dark:bg-dark-surface-secondary text-text-primary dark:text-dark-text-primary focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark"
        rows="3"></textarea>
      <div class="flex gap-2 mt-2">
        <button (click)="addNote()" [disabled]="!noteContent.trim()"
          class="px-3 py-1 bg-primary dark:bg-primary-dark text-white rounded hover:bg-primary-hover dark:hover:bg-primary transition-colors disabled:opacity-50">
          {{ 'chatDetails.notesCard.addNote' | translate }}
        </button>
        <button (click)="cancelNote()"
          class="px-3 py-1 bg-surface-tertiary dark:bg-dark-surface-tertiary text-text-primary dark:text-dark-text-primary rounded hover:bg-surface-elevated dark:hover:bg-dark-surface-elevated transition-colors border border-border dark:border-dark-border">
          {{ 'chatDetails.notesCard.cancel' | translate }}
        </button>
      </div>
    </div>

    <!-- Loading skeleton -->
    <div *ngIf="loading$ | async" class="space-y-3">
      <div *ngFor="let item of [1,2,3]" class="animate-pulse">
        <div class="h-4 bg-surface-secondary dark:bg-dark-surface-secondary rounded w-3/4 mb-2"></div>
        <div class="h-3 bg-surface-secondary dark:bg-dark-surface-secondary rounded w-1/2"></div>
      </div>
    </div>

    <!-- Notes list -->
    <div *ngIf="!(loading$ | async)">
      <ng-container *ngIf="notes$ | async as notes">
        <div *ngIf="notes.length === 0"
          class="text-sm text-text-secondary dark:text-dark-text-secondary text-center py-4">
          {{ 'chatDetails.notesCard.noNotesYet' | translate }}
        </div>

        <div *ngIf="notes.length > 0" class="space-y-3">
          <div *ngFor="let note of notes"
            class="p-3 bg-surface-secondary dark:bg-dark-surface-secondary rounded-lg border border-border dark:border-dark-border">

            <!-- Edit Mode -->
            <div *ngIf="editingNoteId === note.id" class="space-y-2">
              <textarea [(ngModel)]="editingContent"
                class="w-full px-3 py-2 border border-border dark:border-dark-border rounded-lg bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark"
                rows="3"></textarea>
              <div class="flex gap-2">
                <button (click)="saveEditNote()" [disabled]="!editingContent.trim()"
                  class="px-3 py-1 bg-success text-white rounded hover:bg-success-dark transition-colors disabled:opacity-50">
                  {{ 'chatDetails.notesCard.save' | translate }}
                </button>
                <button (click)="cancelEditNote()"
                  class="px-3 py-1 bg-surface-tertiary dark:bg-dark-surface-tertiary text-text-primary dark:text-dark-text-primary rounded hover:bg-surface-elevated dark:hover:bg-dark-surface-elevated transition-colors border border-border dark:border-dark-border">
                  {{ 'chatDetails.notesCard.cancel' | translate }}
                </button>
              </div>
            </div>

            <!-- View Mode -->
            <div *ngIf="editingNoteId !== note.id">
              <div class="text-sm text-text-primary dark:text-dark-text-primary mb-1">{{ note.content }}</div>
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <div class="text-xs text-text-secondary dark:text-dark-text-secondary">{{ note.updated_at |
                    date:'short' }}</div>
                  <div class="text-xs text-primary dark:text-primary-dark font-semibold">{{ note.user.username }}</div>
                </div>
                <div class="flex items-center gap-1">
                  <button (click)="startEditNote(note)"
                    class="p-1 hover:bg-surface-tertiary dark:hover:bg-dark-surface-tertiary rounded-full transition-colors"
                    [attr.title]="'chatDetails.notesCard.editNote' | translate">
                    <svg class="w-4 h-4 text-text-secondary dark:text-dark-text-secondary" fill="none"
                      stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 
                               112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                  </button>
                  <button (click)="deleteNote(note.id)"
                    class="p-1 hover:bg-red-100 dark:hover:bg-red-900/20 rounded-full transition-colors"
                    [attr.title]="'chatDetails.notesCard.deleteNote' | translate">
                    <svg class="w-4 h-4 text-red-500 dark:text-red-400" fill="none" stroke="currentColor"
                      viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 
                               0116.138 21H7.862a2 2 0 
                               01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 
                               1 0 00-1-1h-4a1 1 0 00-1 
                               1v3M4 7h16"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Load more -->
          <div *ngIf="notes.length > 0" class="mt-4 text-center">
            <button (click)="loadMoreNotes()" [disabled]="loading$ | async"
              class="px-4 py-2 bg-primary dark:bg-primary-dark text-white rounded hover:bg-primary-hover dark:hover:bg-primary transition-colors disabled:opacity-50">
              {{ 'chatDetails.notesCard.loadMoreNotes' | translate }}
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
