<div
  class="border border-border dark:border-dark-border rounded-lg cursor-pointer hover:bg-surface-secondary dark:hover:bg-dark-surface-secondary bg-surface dark:bg-dark-surface transition-colors shadow-md dark:shadow-dark-md"
  (click)="openTagsDialog()">

  <div class="flex items-center justify-between p-3">
    <div class="flex items-center gap-2">
      <span class="text-sm font-semibold text-text-primary dark:text-dark-text-primary">{{ 'chatDetails.tagsCard.title'
        | translate }}</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-text-secondary dark:text-dark-text-secondary">{{ 'chatDetails.tagsCard.clickToView' |
        translate }}</span>
    </div>
  </div>

  <div class="px-4 pb-4">
    <!-- Loading skeleton -->
    <div *ngIf="loading$ | async">
      <div class="flex gap-2 mb-3">
        <app-skeleton-loader type="card" width="w-16" height="h-6"></app-skeleton-loader>
        <app-skeleton-loader type="card" width="w-20" height="h-6"></app-skeleton-loader>
        <app-skeleton-loader type="card" width="w-14" height="h-6"></app-skeleton-loader>
      </div>
    </div>

    <!-- Tags list -->
    <div *ngIf="!(loading$ | async)">
      <ng-container *ngIf="tags$ | async as tags">

        <div *ngIf="tags.length === 0" class="text-sm text-text-secondary dark:text-dark-text-secondary">
          {{ 'chatDetails.tagsCard.noTagsFound' | translate }}
        </div>

        <div *ngIf="tags.length > 0" class="space-y-3">
          <div class="flex flex-wrap gap-2">
            <div *ngFor="let tag of tags.slice(0,2)" class="mb-2">
              <span
                class="inline-block bg-gradient-to-r from-primary to-secondary text-surface dark:text-dark-text-inverse text-xs font-semibold px-3 py-2 rounded-full shadow-md">
                {{ tag.name }}
              </span>
            </div>
          </div>

          <div *ngIf="tags.length > 2" class="text-xs text-primary dark:text-primary-dark font-semibold">
            {{ 'chatDetails.tagsCard.moreTags' | translate: {count: tags.length - 2} }}
          </div>
        </div>

      </ng-container>
    </div>
  </div>
</div>
