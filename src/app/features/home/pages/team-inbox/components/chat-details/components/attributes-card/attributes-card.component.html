<div
  class="border border-border dark:border-dark-border rounded-lg cursor-pointer hover:bg-surface-secondary dark:hover:bg-dark-surface-secondary bg-surface dark:bg-dark-surface transition-colors shadow-md dark:shadow-dark-md"
  (click)="openAttributesDialog()">

  <div class="flex items-center justify-between p-3">
    <div class="flex items-center gap-2">
      <!-- icon -->
      <span class="text-sm font-semibold text-text-primary dark:text-dark-text-primary">{{
        'chatDetails.attributesCard.title' | translate }}</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-text-secondary dark:text-dark-text-secondary">{{
        'chatDetails.attributesCard.clickToView' | translate }}</span>
    </div>
  </div>

  <div class="px-4 pb-4">
    <!-- Loading skeleton -->
    <div *ngIf="loading$ | async">
      <div class="mb-3" *ngFor="let item of [1,2,3]">
        <app-skeleton-loader type="paragraph" width="w-16" height="h-3" class="mb-1"></app-skeleton-loader>
        <app-skeleton-loader type="paragraph" width="w-32" height="h-4"></app-skeleton-loader>
      </div>
    </div>

    <!-- Attributes list -->
    <div *ngIf="!(loading$ | async)">
      <ng-container *ngIf="attributes$ | async as attributes">
        <div *ngIf="attributes.length === 0" class="text-sm text-text-secondary dark:text-dark-text-secondary">
          {{ 'chatDetails.attributesCard.noAttributesFound' | translate }}
        </div>

        <div *ngIf="attributes.length > 0" class="space-y-2">
          <div *ngFor="let attribute of attributes.slice(0, 2)" class="mb-2">
            <div class="text-xs font-semibold text-primary dark:text-primary-dark mb-1">
              {{ attribute.name }}
            </div>
          </div>

          <div *ngIf="attributes.length > 2" class="text-xs text-primary dark:text-primary-dark font-semibold">
            {{ 'chatDetails.attributesCard.moreAttributes' | translate: {count: attributes.length - 2} }}
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
