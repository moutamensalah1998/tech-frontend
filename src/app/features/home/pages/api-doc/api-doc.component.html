<div class="h-full overflow-y-auto bg-gray-50 dark:bg-dark-surface">
  <!-- Header Bar -->
  <div class="bg-white/80 dark:bg-dark-surface-elevated/80 backdrop-blur-sm border-b border-gray-200/50 dark:border-dark-border/50 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-4">
          <div class="flex items-center space-x-3">
            <div
              class="w-8 h-8 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center"
            >
              <svg
                class="w-5 h-5 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
                />
              </svg>
            </div>
            <div>
              <h1 class="text-xl font-semibold text-gray-900 dark:text-dark-text-primary">{{ 'navigation.apiDoc' | translate }}</h1>
              <p class="text-sm text-gray-500 dark:text-dark-text-secondary -mt-0.5">{{ 'apiDoc.subtitle' | translate }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- API Configuration Section -->
  <div
    class="bg-white dark:bg-dark-surface-elevated border-b border-gray-200 dark:border-gray-700 sticky top-16 z-30 overflow-x-hidden"
  >
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="grid grid-cols-1 gap-4 min-w-0">
        <!-- Base URL -->
        <div class="flex items-center space-x-3 rtl:space-x-reverse min-w-0">
          <label class="text-sm font-semibold text-gray-700 dark:text-dark-text-primary min-w-[100px]">
            {{ 'apiDoc.baseUrl' | translate }}:
          </label>

          <div
            class="flex-1 flex items-center space-x-2 rtl:space-x-reverse bg-gray-50 dark:bg-dark-surface-tertiary rounded-lg px-3 py-2 border border-gray-200 dark:border-gray-700 min-w-0"
          >
            <code
              class="flex-1 min-w-0 text-sm text-gray-900 dark:text-dark-text-primary font-mono truncate"
            >
              {{ baseUrl }}
            </code>

            <button
              (click)="copyToClipboard(baseUrl, 'baseUrl')"
              class="flex-shrink-0 px-3 py-1 bg-blue-600 dark:bg-blue-500 hover:bg-blue-700 dark:hover:bg-blue-600 text-white text-xs font-medium rounded transition-colors"
            >
              <span *ngIf="!copiedBaseUrl">{{ 'apiDoc.copy' | translate }}</span>
              <span *ngIf="copiedBaseUrl">{{ 'apiDoc.copied' | translate }}</span>
            </button>
          </div>
        </div>

        <!-- Access Token -->
        <div class="flex items-center space-x-3 rtl:space-x-reverse min-w-0">
          <label class="text-sm font-semibold text-gray-700 dark:text-dark-text-primary min-w-[100px]">
            {{ 'apiDoc.accessToken' | translate }}:
          </label>

          <div class="flex-1 min-w-0">
            <div
              *ngIf="accessToken$ | async as token"
              class="relative flex items-center space-x-2 rtl:space-x-reverse bg-gray-50 dark:bg-dark-surface-tertiary rounded-lg px-3 py-2 border border-gray-200 dark:border-gray-700 min-w-0 w-full"
            >
              <!-- Token text -->
              <code
                class="flex-1 min-w-0 text-sm font-mono text-gray-900 dark:text-dark-text-primary truncate pr-16 rtl:pr-0 rtl:pl-16"
              >
                {{ token }}
              </code>

              <!-- Fade overlay -->
              <div
                class="pointer-events-none absolute right-14 rtl:right-auto rtl:left-14 top-0 h-full w-10 bg-gradient-to-r dark:bg-gradient-to-r from-transparent to-gray-50 dark:to-dark-surface-tertiary"
              ></div>

              <!-- Copy button -->
              <button
                (click)="copyToClipboard(token, 'token')"
                class="flex-shrink-0 px-3 py-1 bg-blue-600 dark:bg-blue-500 hover:bg-blue-700 dark:hover:bg-blue-600 text-white text-xs font-medium rounded transition-colors relative z-10"
              >
                <span *ngIf="!copiedToken">{{ 'apiDoc.copy' | translate }}</span>
                <span *ngIf="copiedToken">{{ 'apiDoc.copied' | translate }}</span>
              </button>
            </div>

            <!-- Generate token -->
            <button
              *ngIf="!(accessToken$ | async)"
              (click)="onGenerateToken()"
              [disabled]="generatingToken$ | async"
              class="w-full px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-500 dark:to-indigo-500 hover:from-blue-700 hover:to-indigo-700 dark:hover:from-blue-600 dark:hover:to-indigo-600 text-white text-sm font-medium rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
            >
              {{ (generatingToken$ | async) ? ('apiDoc.getting' | translate) : ('apiDoc.getToken' | translate) }}
            </button>

            <div *ngIf="tokenError$ | async" class="text-xs text-red-600 dark:text-red-400 mt-1">
              {{ 'apiDoc.failedToGetToken' | translate }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="h-full">
    <!-- Loading State -->
    <div
      *ngIf="loading$ | async"
      class="flex justify-center items-center py-20"
    >
      <app-loader></app-loader>
    </div>

    <!-- Error State -->
    <div *ngIf="(error$ | async) && !(loading$ | async)" class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/30 rounded-xl p-6 m-6">
      <div class="flex items-center space-x-3 rtl:space-x-reverse">
        <svg class="w-6 h-6 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div>
          <h3 class="text-lg font-semibold text-red-900 dark:text-red-200">{{ 'apiDoc.errorTitle' | translate }}</h3>
          <p class="text-sm text-red-700 dark:text-red-300 mt-1">{{ 'apiDoc.errorMessage' | translate }}</p>
        </div>
      </div>
    </div>

    <!-- Swagger UI Container - Always rendered but hidden when loading/error -->
    <div 
      #swaggerContainer 
      id="swagger-ui" 
      class="swagger-container dark:bg-dark-surface"
      [class.hidden]="(loading$ | async) || (error$ | async)">
    </div>
  </div>
</div>
