<div class="mb-4">
  <div class="flex items-center justify-between mb-2">
    <span class="text-sm font-medium text-text-secondary dark:text-dark-text-secondary">
      {{ 'broadcast.create.recipients.progress.count' | translate:{current: currentValue, max: maxValue} }}
    </span>
    <span class="text-sm text-text-tertiary dark:text-dark-text-tertiary">
      {{getPercentage().toFixed(1)}}%
    </span>
  </div>
  <div class="w-full bg-surface-tertiary dark:bg-dark-surface-tertiary rounded-full h-2">
    <div class="h-2 rounded-full transition-all duration-300" [style.width.%]="getPercentage()"
      [ngClass]="getProgressColorClass()">
    </div>
  </div>

  <!-- Warning Messages -->
  <div *ngIf="showWarning()" class="mt-2">
    <div class="flex items-center p-2 rounded-lg text-xs" [ngClass]="getWarningClass()">
      <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd"
          d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
          clip-rule="evenodd"></path>
      </svg>
      <span>{{getWarningMessage()}}</span>
    </div>
  </div>
</div>
