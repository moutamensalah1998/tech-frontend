<div
  class="px-8 py-4 bg-surface-secondary dark:bg-dark-surface-secondary border-b border-border dark:border-dark-border mb-6 rounded-lg">
  <div class="flex items-center justify-between gap-4">
    <div class="relative flex-1 max-w-md">
      <input type="text" [placeholder]="'broadcast.scheduled.searchPlaceholder' | translate" [(ngModel)]="searchTerm"
        (ngModelChange)="onInputChange($event)"
        class="w-full border border-border dark:border-dark-border rounded-lg px-3 py-2 bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary placeholder-text-tertiary dark:placeholder-dark-text-tertiary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
    </div>

    <div class="flex items-center gap-3">
      <label class="text-text-secondary dark:text-dark-text-secondary font-medium">{{ 'broadcast.common.filterBy' |
        translate }}</label>
      <select [ngModel]="sortedBy" (ngModelChange)="onSortChange($event)"
        class="border border-border dark:border-dark-border rounded-lg px-4 py-2 bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
        <option value="NONE">{{ 'broadcast.common.none' | translate }}</option>
        <option value="ASCENDING">{{ 'broadcast.common.ascending' | translate }}</option>
        <option value="DESCENDING">{{ 'broadcast.common.descending' | translate }}</option>
      </select>
    </div>
  </div>
</div>
