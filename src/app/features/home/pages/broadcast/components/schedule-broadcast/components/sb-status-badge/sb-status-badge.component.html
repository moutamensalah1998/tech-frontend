<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium" [ngClass]="{
        'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300': status === 'scheduled',
        'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300': status === 'sent',
        'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300': status === 'pending',
        'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300': status === 'failed',
        'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300': !status
      }">
  {{ (status ? 'broadcast.scheduled.status.' + status : 'broadcast.scheduled.status.unknown') | translate }}
</span>
