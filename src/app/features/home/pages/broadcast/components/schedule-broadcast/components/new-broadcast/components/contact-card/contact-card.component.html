<div
  class="contact-card flex items-center p-4 border border-border dark:border-dark-border rounded-lg hover:bg-surface-secondary dark:hover:bg-dark-surface-secondary transition-all duration-200 cursor-pointer group"
  [ngClass]="{
        'ring-2 ring-primary dark:ring-primary-dark bg-blue-50 dark:bg-blue-900/20 border-blue-200 dark:border-blue-800': isSelected,
        'hover:border-border dark:hover:border-dark-border': !isSelected
      }" (click)="onToggle()">
  <input type="checkbox" [checked]="isSelected" [disabled]="isDisabled"
    class="h-4 w-4 text-primary dark:text-primary-dark focus:ring-primary border-border dark:border-dark-border rounded transition-colors"
    (click)="$event.stopPropagation()" (change)="onToggle()" />

  <div class="ml-4 flex-1 min-w-0">
    <div class="flex items-center justify-between">
      <div class="flex-1 min-w-0">
        <!-- Contact Avatar -->
        <div class="flex items-center space-x-3">
          <div
            class="w-10 h-10 bg-gradient-to-br from-primary to-primary-hover dark:from-primary-dark dark:to-primary rounded-full flex items-center justify-center text-white font-medium text-sm">
            {{getInitials(contact.name)}}
          </div>
          <div>
            <h4 class="text-sm font-medium text-text-primary dark:text-dark-text-primary truncate">
              {{contact.name}}
            </h4>
            <p class="text-sm text-text-secondary dark:text-dark-text-secondary mt-1">
              {{contact.country_code}} {{contact.phone_number}}
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-2 ml-4">
        <!-- Status Badge -->
        <span class="status-badge inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="{
                    'bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-300': contact.status === 'valid',
                    'bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-300': contact.status === 'invalid',
                    'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-300': contact.status !== 'valid' && contact.status !== 'invalid'
                  }">
          <div class="w-1.5 h-1.5 rounded-full mr-1.5" [ngClass]="{
                     'bg-green-500': contact.status === 'valid',
                     'bg-red-500': contact.status === 'invalid',
                     'bg-gray-500': contact.status !== 'valid' && contact.status !== 'invalid'
                   }"></div>
          {{contact.status | titlecase}}
        </span>

        <!-- Selection Indicator -->
        <div *ngIf="isSelected" class="selection-indicator w-2 h-2 bg-primary dark:bg-primary-dark rounded-full"></div>
      </div>
    </div>

    <!-- Contact Details -->
    <div class="mt-2">
      <!-- Broadcast Settings -->
      <div class="flex items-center space-x-4 text-xs text-text-tertiary dark:text-dark-text-tertiary">
        <span class="flex items-center">
          <svg class="w-3 h-3 mr-1" [class.text-green-500]="contact.allow_broadcast"
            [class.text-red-500]="!contact.allow_broadcast" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
              clip-rule="evenodd" *ngIf="contact.allow_broadcast"></path>
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd" *ngIf="!contact.allow_broadcast"></path>
          </svg>
          Broadcast
        </span>
        <span class="flex items-center">
          <svg class="w-3 h-3 mr-1" [class.text-green-500]="contact.allow_sms" [class.text-red-500]="!contact.allow_sms"
            fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
              clip-rule="evenodd" *ngIf="contact.allow_sms"></path>
            <path fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd" *ngIf="!contact.allow_sms"></path>
          </svg>
          SMS
        </span>
      </div>
    </div>

    <!-- Tags and Attributes -->
    <div *ngIf="contact.tag_links?.length || contact.attribute_links?.length" class="mt-3 flex flex-wrap gap-1">
      <span *ngFor="let tag of contact.tag_links"
        class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-purple-100 dark:bg-purple-900/30 text-purple-800 dark:text-purple-300 border border-purple-200 dark:border-purple-800">
        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
            d="M17.707 9.293a1 1 0 010 1.414l-7 7a1 1 0 01-1.414 0l-7-7A.997.997 0 012 10V5a3 3 0 013-3h5c.256 0 .512.098.707.293l7 7zM5 6a1 1 0 100-2 1 1 0 000 2z"
            clip-rule="evenodd"></path>
        </svg>
        {{tag.tag?.name}}
      </span>
      <span *ngFor="let attr of contact.attribute_links"
        class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-blue-100 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 border border-blue-200 dark:border-blue-800">
        <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H4zm0 2h12v8H4V6z"
            clip-rule="evenodd"></path>
        </svg>
        {{attr.attribute?.name}}: {{attr.value}}
      </span>
    </div>
  </div>
</div>
