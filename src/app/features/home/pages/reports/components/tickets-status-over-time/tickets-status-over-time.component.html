<div class="bg-white dark:bg-dark-surface-elevated rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 h-full">
  <h2 class="text-lg font-semibold text-gray-900 dark:text-dark-text-primary mb-6">{{ 'reports.ticketsStatusOverTime.title' | translate }}</h2>
  
  <div *ngIf="loading$ | async" class="flex justify-center items-center py-12">
    <app-loader></app-loader>
  </div>

  <div *ngIf="error$ | async" class="bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/30 rounded-lg p-4">
    <p class="text-sm text-red-600 dark:text-red-400">{{ 'reports.error.loadFailed' | translate }}</p>
  </div>

  <div *ngIf="!(loading$ | async) && !(error$ | async)" class="h-80">
    <canvas baseChart
      [data]="lineChartData"
      [options]="lineChartOptions"
      type="line">
    </canvas>
  </div>
</div>
