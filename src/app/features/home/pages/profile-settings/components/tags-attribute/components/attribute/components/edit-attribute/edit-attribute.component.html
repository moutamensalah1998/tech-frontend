<div class="flex flex-col bg-surface dark:bg-dark-surface h-full p-6 rounded-xl">
    <h2 class="text-xl font-bold text-center text-text-primary dark:text-dark-text-primary mb-6">{{ 'profile.attributes.editAttributeDialog.title' |
        translate }}</h2>

    <div class="flex-grow">
        <label class="block text-sm font-medium text-text-primary dark:text-dark-text-primary mb-2">{{
            'profile.attributes.editAttributeDialog.newAttributeName' | translate }}</label>
        <input type="text" [(ngModel)]="newName"
            class="w-full border border-border dark:border-dark-border rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark focus:border-transparent transition-all bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary placeholder-text-secondary dark:placeholder-dark-text-secondary" />
    </div>

    <button
        class="w-full bg-primary hover:bg-primary-hover disabled:bg-border disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition-colors mt-6"
        (click)="editeAttribute()" [disabled]="!newName || newName === data">
        {{ 'profile.attributes.editAttributeDialog.editButton' | translate }}
    </button>
</div>
