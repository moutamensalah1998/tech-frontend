<div class="fixed inset-0 flex items-center justify-center bg-black/70 z-50" (click)="closeDialog()"
  role="presentation">
  <div
    class="bg-surface dark:bg-dark-surface rounded-lg shadow-lg dark:shadow-dark-lg p-6 max-w-md w-full max-h-[85vh] flex flex-col dialog-container"
    (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="addTeamTitle">
    <div class="mb-4 border-b pb-3 border-border dark:border-dark-border">
      <h1 id="addTeamTitle" class="text-xl font-semibold text-text-primary dark:text-dark-text-primary">
        {{ 'userManagement.addTeamDialog.title' | translate }}
      </h1>
    </div>

    <form [formGroup]="teamForm" (ngSubmit)="onSubmit()" class="flex-1 overflow-y-auto py-1 px-1 space-y-4" novalidate>
      <div class="space-y-4">
        <div class="space-y-1">
          <label class="text-sm font-medium text-text-secondary dark:text-dark-text-secondary block" for="teamName">
            {{ 'userManagement.teamName' | translate }}
          </label>

          <input type="text" name="teamName" formControlName="teamName" id="teamName"
            [placeholder]="'userManagement.addTeamDialog.teamNamePlaceholder' | translate"
            class="w-full px-3 py-2 text-sm rounded-md bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary border border-border dark:border-dark-border
                   focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark focus:border-primary dark:focus:border-primary-dark transition"
            [class.invalid]="teamForm.get('teamName')?.invalid && teamForm.get('teamName')?.touched" />

          <div *ngIf="teamForm.get('teamName')?.invalid && teamForm.get('teamName')?.touched"
            class="text-danger dark:text-danger-dark text-sm mt-2" role="alert">
            <div *ngIf="teamForm.get('teamName')?.hasError('required')">
              {{ 'userManagement.addTeamDialog.teamNameRequired' | translate }}
            </div>
          </div>
        </div>
      </div>

      <div class="flex mt-6 pt-4 border-t border-border dark:border-dark-border w-full justify-end gap-3">
        <button type="button" (click)="closeDialog()"
          class="px-4 py-2 text-sm rounded-md bg-surface-secondary dark:bg-dark-surface-secondary text-text-secondary dark:text-dark-text-secondary hover:bg-surface-tertiary dark:hover:bg-dark-surface-tertiary
                 focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark focus:ring-offset-1 transition-colors">
          {{ 'common.buttons.cancel' | translate }}
        </button>

        <button type="submit" [disabled]="teamForm.invalid" class="px-4 py-2 text-sm rounded-md bg-primary dark:bg-primary-dark hover:bg-primary-hover dark:hover:bg-primary text-white
                 focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark focus:ring-offset-1 transition-colors
                 disabled:opacity-50 disabled:cursor-not-allowed">
          {{ 'userManagement.addTeamDialog.submit' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
