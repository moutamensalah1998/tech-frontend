<div class="fixed inset-0 flex items-center justify-center bg-black/70 z-50" (click)="closeDialog()">
    <div class="bg-surface dark:bg-dark-surface rounded-lg shadow-lg dark:shadow-dark-lg p-6 max-w-md w-full max-h-[85vh] flex flex-col dialog-container"
        (click)="$event.stopPropagation()">
        <div class="mb-4 border-b border-border dark:border-dark-border pb-3">
            <h1 class="text-xl font-semibold text-text-primary dark:text-dark-text-primary">
                {{ 'userManagement.editTeamDialog.title' | translate }}
            </h1>
        </div>

        <form [formGroup]="teamForm" (ngSubmit)="onSubmit()" class="flex-1 overflow-y-auto py-1 px-1 space-y-4">
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-sm font-medium text-text-secondary dark:text-dark-text-secondary block">
                        {{ 'userManagement.teamName' | translate }}
                    </label>
                    <input type="text" name="teamName" formControlName="teamName" id="teamName"
                        [placeholder]="'userManagement.editTeamDialog.teamNamePlaceholder' | translate"
                        class="w-full px-3 py-1.5 text-sm border border-border dark:border-dark-border rounded-md bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary focus:outline-none focus:ring-1 focus:ring-primary dark:focus:ring-primary-dark">

                    <div *ngIf="teamForm.get('teamName')?.invalid && teamForm.get('teamName')?.touched"
                        class="text-danger dark:text-danger-dark text-sm mt-2">
                        <div *ngIf="teamForm.get('teamName')?.hasError('required')">
                            {{ 'userManagement.editTeamDialog.teamNameRequired' | translate }}
                        </div>
                    </div>
                </div>

                <div class="space-y-1">
                    <!-- <label class="text-sm font-medium text-text-secondary dark:text-dark-text-secondary block">Team Members</label> -->
                    <app-chip-list [availableChips]="allUsers" [selectedChips]="selectedUsers"
                        (selectedChipsChange)="onSelectedUsersChange($event)"
                        [label]="'userManagement.teamMembers' | translate"
                        [input_placeholder]="'userManagement.addTeamMembers' | translate"></app-chip-list>
                </div>
            </div>

            <div class="flex mt-6 pt-4 border-t border-border dark:border-dark-border w-full justify-end gap-3">
                <button type="button"
                    class="px-4 py-1.5 text-sm bg-surface-secondary dark:bg-dark-surface-secondary text-text-secondary dark:text-dark-text-secondary rounded-md hover:bg-surface-tertiary dark:hover:bg-dark-surface-tertiary
                        focus:outline-none focus:ring-1 focus:ring-primary dark:focus:ring-primary-dark transition-colors"
                    (click)="closeDialog()">
                    {{ 'common.buttons.cancel' | translate }}
                </button>

                <button type="submit" [disabled]="teamForm.invalid"
                    class="px-4 py-1.5 text-sm bg-primary dark:bg-primary-dark text-white rounded-md hover:bg-primary-hover dark:hover:bg-primary
                        focus:outline-none focus:ring-1 focus:ring-primary dark:focus:ring-primary-dark transition-colors disabled:opacity-50">
                    {{ 'userManagement.editTeamDialog.submit' | translate }}
                </button>
            </div>
        </form>
    </div>
</div>
