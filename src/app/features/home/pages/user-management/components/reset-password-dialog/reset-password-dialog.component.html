<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm" (click)="onCancel()">
    <div class="w-full mx-4 my-4 max-w-md lg:max-w-lg bg-surface dark:bg-dark-surface rounded-lg shadow-xl dark:shadow-dark-xl
            transition-all transform max-h-[90vh] overflow-y-auto" (click)="$event.stopPropagation()">

        <div class="p-6">
            <div class="flex justify-between items-start mb-6">
                <h3 class="text-xl font-semibold text-text-primary dark:text-dark-text-primary">
                    {{ 'userManagement.resetPasswordDialog.title' | translate }}
                </h3>
                <button
                    class="text-text-tertiary dark:text-dark-text-tertiary hover:text-text-secondary dark:hover:text-dark-text-secondary transition-colors"
                    (click)="onCancel(); $event.stopPropagation()"
                    [attr.aria-label]="'common.buttons.closeAriaLabel' | translate">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>


            <form (ngSubmit)="onConfirm()" autocomplete="off">
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-text-secondary dark:text-dark-text-secondary mb-1">
                            {{ 'userManagement.resetPasswordDialog.newPassword' | translate }}
                        </label>
                        <input type="password" [(ngModel)]="newPassword" name="newPassword" autocomplete="new-password"
                            class="w-full px-3 py-2 border border-border dark:border-dark-border rounded-md bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-text-secondary dark:text-dark-text-secondary mb-1">
                            {{ 'userManagement.resetPasswordDialog.confirmPassword' | translate }}
                        </label>
                        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
                            autocomplete="new-password"
                            class="w-full px-3 py-2 border border-border dark:border-dark-border rounded-md bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark">
                    </div>
                    <div *ngIf="errorMessageKey" class="text-danger dark:text-danger-dark text-sm mt-2">
                        {{ errorMessageKey | translate }}
                    </div>
                </div>

                <div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
                    <button type="button" class="px-6 py-2 text-text-secondary dark:text-dark-text-secondary bg-surface-secondary dark:bg-dark-surface-secondary hover:bg-surface-tertiary dark:hover:bg-dark-surface-tertiary rounded-md 
                            transition-colors text-sm font-medium w-full sm:w-auto"
                        (click)="onCancel(); $event.stopPropagation()">
                        {{ 'common.buttons.cancel' | translate }}
                    </button>
                    <button type="submit" class="px-6 py-2 text-white bg-primary dark:bg-primary-dark hover:bg-primary-hover dark:hover:bg-primary rounded-md 
                            transition-colors text-sm font-medium w-full sm:w-auto">
                        {{ 'common.buttons.confirm' | translate }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
