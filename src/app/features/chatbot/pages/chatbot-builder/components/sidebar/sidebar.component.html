<!-- sidebar.component.html - Updated with loading state -->
<aside class="h-[10vh] bg-blue-500 text-white flex items-center p-4 space-x-6 relative">
  <!-- Loading Overlay -->
  <div
    *ngIf="isSubmitting"
    class="absolute inset-0 bg-blue-600 bg-opacity-90 flex items-center justify-center z-50 rounded-lg">
    <div class="flex items-center space-x-3">
      <!-- Spinning loader -->
      <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
      <span class="text-white font-medium">{{ 'chatbot.builder.sidebar.savingFlow' | translate }}</span>
    </div>
  </div>

  <h3 class="text-xl font-semibold whitespace-nowrap">{{ 'chatbot.builder.sidebar.chatbotInfo' | translate }}</h3>

  <form class="flex-1 flex items-center space-x-4">
    <!-- Name -->
    <div class="flex-1">
      <label for="name" class="block text-sm font-medium mb-1">{{ 'chatbot.builder.sidebar.name' | translate }}</label>
      <input
        type="text"
        disabled="true"
        id="name"
        name="name"
        minlength="1"
        maxlength="100"
        [(ngModel)]="chatBotName"
        class="w-full px-3 py-2 rounded bg-white text-black border border-gray-100 focus:outline-none focus:ring-2 focus:ring-red-500"
        [placeholder]="'chatbot.builder.sidebar.namePlaceholder' | translate" />
    </div>

    <!-- Language -->
    <div class="flex-1">
      <label for="language"
        class="block text-sm font-medium mb-1">{{ 'chatbot.builder.sidebar.language' | translate }}</label>
      <input
        disabled="true"
        type="text"
        id="language"
        name="language"
        minlength="2"
        maxlength="10"
        [(ngModel)]="chatBotLanguage"
        class="w-full px-3 py-2 rounded bg-white text-black border border-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500"
        [placeholder]="'chatbot.builder.sidebar.languagePlaceholder' | translate" />
    </div>

    <!-- Version -->
    <div class="flex-1">
      <label for="version"
        class="block text-sm font-medium mb-1">{{ 'chatbot.builder.sidebar.version' | translate }}</label>
      <input
        disabled="true"
        type="number"
        id="version"
        name="version"
        min="0.1"
        step="0.1"
        [(ngModel)]="chatBotVersion"
        class="w-full px-3 py-2 rounded bg-white text-black border border-gray-100 focus:outline-none focus:ring-2 focus:ring-yellow-500"
        placeholder="1.0" />
    </div>

    <!-- Auto-save Status -->
    <div class="flex items-end mr-4">
      <div class="text-xs" [class]="autoSaveStatusClass">
        <span *ngIf="autoSaveState.isAutoSaving" class="flex items-center">
          <span class="text-white animate-spin rounded-full h-3 w-3 border-b border-current inline-block mr-1"></span>
        </span>
        {{ autoSaveStatusText }}
      </div>
    </div>

    <!-- Save Flow Nodes button -->
    <div class="flex items-end">
      <button
        type="button"
        (click)="saveFlow()"
        [disabled]="saveButtonDisabled"
        [class]="saveButtonDisabled
          ? 'px-6 py-2 mt-6 bg-gray-400 text-gray-600 rounded font-medium cursor-not-allowed whitespace-nowrap'
          : 'px-6 py-2 mt-6 bg-white text-black hover:bg-blue-900 hover:text-white rounded font-medium transition whitespace-nowrap'"
        [title]="isSubmitting ? ('chatbot.builder.sidebar.savingFlow' | translate) : ('chatbot.builder.sidebar.saveFlow' | translate)">

        <!-- Button content with loading state -->
        <div class="flex items-center space-x-2">
          <div
            *ngIf="isSubmitting"
            class="animate-spin rounded-full h-4 w-4 border-b-2 border-current">
          </div>
          <span>{{ saveButtonText }}</span>
        </div>
      </button>
    </div>
  </form>

  <!-- Error Message -->
  <div
    *ngIf="submitError && !isSubmitting"
    class="absolute bottom-full left-4 right-4 mb-2 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg animate-fade-in">
    <div class="flex items-center space-x-2">
      <span class="material-icons text-sm">error</span>
      <span class="text-sm">{{ submitError }}</span>
    </div>
  </div>
</aside>
