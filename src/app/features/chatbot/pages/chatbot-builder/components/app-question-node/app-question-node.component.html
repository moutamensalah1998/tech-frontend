<!-- app-question-node.component.html -->
<div
  class="node-card bg-white rounded-lg shadow-lg p-4 cursor-grab active:cursor-grabbing select-none relative will-change-transform transition-shadow duration-200 hover:shadow-xl"
  [class.dragging]="isDragging"
  [class.no-transition]="isDragging"
  [class.ring-2]="isFirstNode"
  [class.ring-green-400]="isFirstNode"
  [class.ring-offset-2]="isFirstNode"
  [class.border-2]="true"
  [class.border-red-500]="getValidationState() === 'error'"
  [class.border-yellow-500]="getValidationState() === 'warning'"
  [class.border-green-500]="getValidationState() === 'valid'"
  [class.border-gray-200]="getValidationState() === 'unknown'"
  [title]="getValidationTooltip()"
  (mousedown)="onMouseDown($event)"
  (touchstart)="onTouchStart($event)"
>
  <app-connection-button (connectionStart)="onConnectionStart.emit($event)">
  </app-connection-button>

  <!-- Validation Badge -->
  <div 
    *ngIf="getValidationState() !== 'unknown' && getValidationState() !== 'valid'"
    class="absolute top-2 right-2 z-10"
    [title]="getValidationTooltip()">
    <span 
      *ngIf="getValidationState() === 'error'"
      class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800 border border-red-300">
      <span class="material-icons text-xs mr-1">error</span>
      {{ getValidationErrors().length }}
    </span>
    <span 
      *ngIf="getValidationState() === 'warning'"
      class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 border border-yellow-300">
      <span class="material-icons text-xs mr-1">warning</span>
      {{ getValidationWarnings().length }}
    </span>
  </div>

  <app-node-header
    [title]="node.title || ('chatbot.builder.nodes.question.title' | translate)"
    icon="question_answer"
    color="green"
    [node]="node"
    [isFirstNode]="isFirstNode"
    (addNode)="onAddNode.emit()"
    (delete)="onDelete.emit()"
    (setAsFirst)="onSetAsFirst($event)"
  >
  </app-node-header>

  <form [formGroup]="questionForm" class="space-y-4">
    <!-- First Node Indicator -->
    <div *ngIf="isFirstNode" class="bg-green-50 border border-green-200 rounded-lg p-2 mb-3">
      <div class="flex items-center text-green-700 text-xs">
        <span class="material-icons text-sm mr-1">play_arrow</span>
        {{ 'chatbot.builder.nodes.question.firstNodeIndicator' | translate }}
      </div>
    </div>

    <!-- Question Text Field -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >{{ 'chatbot.builder.nodes.question.questionText' | translate }}</label
      >
      <textarea
        formControlName="questionText"
        [placeholder]="'chatbot.builder.nodes.question.questionPlaceholder' | translate"
        class="w-full p-3 border border-gray-300 rounded-lg text-sm resize-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
        rows="3"
      >
      </textarea>
    </div>

    <!-- Save Answer in Variable -->
    <!-- <div class="space-y-3">
      <div class="flex items-center gap-2">
        <input
          type="checkbox"
          [id]="'saveAnswer_' + node.id"
          formControlName="saveToVariable"
          class="w-4 h-4 text-green-600 rounded focus:ring-green-500"
        />
        <label
          [for]="'saveAnswer_' + node.id"
          class="text-sm font-medium text-gray-700"
        >
          Save answer in variable
        </label>
      </div> -->

      <!-- Variable Name Input -->
      <!-- <div *ngIf="questionForm.get('saveToVariable')?.value" class="ml-6">
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Variable Name</label
        >
        <input
          type="text"
          formControlName="variableName"
          placeholder="e.g., user_name, user_email"
          class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500 focus:border-transparent"
        />
        <p class="text-xs text-gray-500 mt-1">
          Use this variable in future messages:
          {{ questionForm.get("variableName")?.value || "variable_name" }}
        </p>
      </div>
    </div> -->

    <!-- Accept Media Response -->
    <div class="flex items-center gap-2">
      <input
        type="checkbox"
        [id]="'acceptMedia_' + node.id"
        formControlName="acceptMediaResponse"
        class="w-4 h-4 text-green-600 rounded focus:ring-green-500"
      />
      <label
        [for]="'acceptMedia_' + node.id"
        class="text-sm font-medium text-gray-700"
      >
        {{ 'chatbot.builder.nodes.question.acceptMedia' | translate }}
      </label>
    </div>
  </form>
</div>
