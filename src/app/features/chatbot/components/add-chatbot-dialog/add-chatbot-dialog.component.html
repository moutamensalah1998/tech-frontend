<div class="relative w-96 p-6 bg-surface dark:bg-dark-surface rounded-lg shadow-xl dark:shadow-dark-lg border border-border dark:border-dark-border">
  <!-- Close button -->
  <button
    type="button"
    (click)="closeDialog()"
    class="absolute top-4 right-4 text-text-secondary dark:text-dark-text-secondary hover:text-danger dark:hover:text-danger-dark focus:outline-none text-xl transition-colors"
  >
    ✕
  </button>

  <h2 class="text-xl font-bold text-primary dark:text-primary-dark mb-6">{{ 'chatbot.addDialog.title' | translate }}</h2>

  <form class="space-y-4">
    <!-- Name -->
    <div>
      <label for="name" class="block text-sm font-medium text-text-primary dark:text-dark-text-primary mb-2">{{ 'chatbot.addDialog.name' | translate }}</label>
      <input
        type="text"
        id="name"
        name="name"
        minlength="1"
        maxlength="100"
        [(ngModel)]="chatbotName"
        required
        class="w-full px-3 py-2 rounded bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary border border-border dark:border-dark-border focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark focus:border-transparent"
        [placeholder]="'chatbot.addDialog.namePlaceholder' | translate"
      />
    </div>

    <!-- Language -->
    <div>
      <label for="language" class="block text-sm font-medium text-text-primary dark:text-dark-text-primary mb-2">{{ 'chatbot.addDialog.language' | translate }}</label>
      <input
        type="text"
        id="language"
        name="language"
        minlength="2"
        maxlength="10"
        [(ngModel)]="chatbotLanguage"
        required
        class="w-full px-3 py-2 rounded bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary border border-border dark:border-dark-border focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark focus:border-transparent"
        [placeholder]="'chatbot.addDialog.languagePlaceholder' | translate"
      />
    </div>

    <!-- Version -->
    <div>
      <label for="version" class="block text-sm font-medium text-text-primary dark:text-dark-text-primary mb-2">{{ 'chatbot.addDialog.version' | translate }}</label>
      <input
        type="number"
        id="version"
        name="version"
        min="0.1"
        step="0.1"
        [(ngModel)]="chatBotVersion"
        required
        class="w-full px-3 py-2 rounded bg-surface dark:bg-dark-surface text-text-primary dark:text-dark-text-primary border border-border dark:border-dark-border focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-primary-dark focus:border-transparent"
        [placeholder]="'chatbot.addDialog.versionPlaceholder' | translate"
      />
    </div>

    <!-- Buttons -->
    <div class="flex justify-end space-x-3 pt-4">
      <button
        type="button"
        (click)="closeDialog()"
        class="px-4 py-2 bg-surface-tertiary dark:bg-dark-surface-tertiary hover:bg-danger dark:hover:bg-danger-dark text-white rounded font-medium transition-colors"
      >
        {{ 'chatbot.addDialog.cancel' | translate }}
      </button>
      <button
        type="button"
        (click)="saveChatBot()"
        [disabled]="!chatbotName || !chatbotLanguage || !chatBotVersion"
        class="px-4 py-2 bg-primary dark:bg-primary-dark hover:bg-primary-hover dark:hover:bg-primary disabled:bg-surface-tertiary dark:disabled:bg-dark-surface-tertiary disabled:cursor-not-allowed text-white rounded font-medium transition-colors"
      >
        {{ 'chatbot.addDialog.save' | translate }}
      </button>
    </div>
  </form>
</div>
