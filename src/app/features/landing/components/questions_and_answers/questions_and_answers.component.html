<!-- questions-and-answers.component.html -->
<section id="questions-and-answers" class="py-20 bg-gradient-to-b from-blue-50/50 via-white to-indigo-50/50 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 transition-colors duration-300">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
      <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white sm:text-4xl lg:text-5xl">
        {{ 'landing.faq.title' | translate }} <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400">{{ 'landing.faq.titleHighlight' | translate }}</span>
      </h2>
      <p class="mt-6 text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
        {{ 'landing.faq.description' | translate }}
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div 
        *ngFor="let question of questions; trackBy: trackByQuestionId" 
        class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-md transition-shadow duration-200"
      >
        <h4 class="font-semibold text-gray-900 dark:text-white mb-3 text-lg">
          {{ question.questionKey | translate }}
        </h4>
        <p class="text-gray-600 dark:text-gray-300 leading-relaxed">
          {{ question.answerKey | translate }}
        </p>
      </div>
    </div>

    <!-- Call to action -->
    <!-- <div class="mt-12 text-center">
      <p class="text-gray-600 dark:text-gray-300 mb-4">
        Still have questions?
      </p>
      <a 
        href="#contact" 
        class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-xl text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 transition-all duration-200 shadow-lg hover:shadow-xl"
      >
        Contact Support
      </a>
    </div> -->
  </div>
</section>
