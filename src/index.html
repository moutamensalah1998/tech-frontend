<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prog Gate</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="prog_gate_icon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('app_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'dark' || stored === 'light' || stored === 'system') ? stored : 'system';
        var resolved = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
        if (resolved === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {
        // Ignore failures; Angular will apply theme later
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js"></script>
</body>
</html>
